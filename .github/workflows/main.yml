name: Compilar Sonic R 32 bits

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Configurar Android SDK y NDK
      uses: android-actions/setup-android@v3

    - name: Instalar NDK específico
      run: |
        sdkmanager --install "ndk;28.2.12215904"

    - name: Otorgar permisos a Gradle
      run: chmod +x gradlew

    - name: Compilar APK con Gradle
      run: ./gradlew assembleDebug

    - name: Subir el APK de 32 bits
      uses: actions/upload-artifact@v4
      with:
        name: SonicR-32bits-APK
        path: app/build/outputs/apk/debug/*.apk
